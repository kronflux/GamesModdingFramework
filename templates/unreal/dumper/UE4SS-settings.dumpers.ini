; ============================================================================
; UE4SS-settings.dumpers.ini
;
; A FRAGMENT, not a full UE4SS-settings.ini. unreal.dump with deployHelper
; merges it into the game's UE4SS-settings.ini: only the keys below change,
; a key that is missing is appended under its section, and every other key is
; left alone. The original file is backed up first.
; ============================================================================

[ObjectDumper]
; Show offsets from the main executable instead of raw pointers, so dumps
; compare across restarts and game versions. Default: 0
UseModuleOffsets = 1

[Hooks]
; The gmfdump console command only works while UE4SS hooks ProcessConsoleExec.
; GmfDumper logs a warning at load when this is 0. The key bind works either way.
HookProcessConsoleExec = 1

[GmfDumper]
; Key that runs every dump (the "all" batch). Any UE4SS Key name, for example
; F8, F9 or NUM_ZERO. Default: F8
; Console: gmfdump [all|objects|actors|meshes|usmap|jmap]
DumpKey = F8
