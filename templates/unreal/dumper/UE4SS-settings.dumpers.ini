; ============================================================================
; UE4SS-settings.dumpers.ini
;
; A FRAGMENT, not a full UE4SS-settings.ini. unreal.deploy_dumper merges it
; into the game's UE4SS-settings.ini: only the keys below change, a key that
; is missing is appended under its section, and every other key is left
; alone. The original file is backed up first.
;
; GmfDumper's own settings (dump key, default profile, output folder) are in
; Mods/GmfDumper/config.lua, not here.
; ============================================================================

[ObjectDumper]
; Show offsets from the main executable instead of raw pointers, so dumps
; compare across restarts and game versions. Default: 0
UseModuleOffsets = 1
; GmfDumper loads every asset itself, once, before its dump steps. With this
; at 1 UE4SS would load them a second time. Default: 0
LoadAllAssetsBeforeDumpingObjects = 0

[CXXHeaderGenerator]
; Same reason as above. Default: 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[Hooks]
; The gmfdump console command only works while UE4SS hooks ProcessConsoleExec.
; The key bind works either way.
; Console: gmfdump [full|quick|list|<step names>]
HookProcessConsoleExec = 1
