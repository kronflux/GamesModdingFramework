name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Catalog, host files and tests
        run: npm run check
      - name: Game content and secret gate
        run: node scripts/pre-commit.mjs
