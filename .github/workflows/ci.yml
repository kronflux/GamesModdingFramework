name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The GmfDumper mod has Lua unit tests (test/dumper). They use Windows paths, so they run on
      # the Windows jobs. If Lua cannot be set up, the Lua test is skipped and the job goes on.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        continue-on-error: true
      - uses: leafo/gh-actions-lua@v11
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          luaVersion: "5.4"
      - name: Catalog, host files and tests
        run: npm run check
      - name: Game content and secret gate
        run: node scripts/pre-commit.mjs
